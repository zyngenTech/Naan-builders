<div class="floating-buttons">
  <a [href]="whatsappUrl()" target="_blank" rel="noopener" class="floating-buttons__btn floating-buttons__btn--whatsapp" aria-label="Chat on WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>
  <a [href]="callUrl()" class="floating-buttons__btn floating-buttons__btn--call" aria-label="Call now">
    <i class="fa-solid fa-phone"></i>
  </a>
</div>
