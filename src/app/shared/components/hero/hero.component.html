<section
  class="hero"
  [class.hero--compact]="compact"
  [style.backgroundImage]="backgroundVideo ? null : 'linear-gradient(180deg, rgba(10,11,13,0.35), rgba(10,11,13,0.92)), url(' + backgroundImage + ')'"
>
  @if (backgroundVideo) {
    <video class="hero__video" [src]="backgroundVideo" autoplay muted loop playsinline></video>
    <div class="hero__video-overlay"></div>
  }
  <div class="hero__overlay-pattern"></div>

  <div class="container-xl hero__content">
    @if (eyebrow) {
      <span class="hero__eyebrow reveal is-visible">{{ eyebrow }}</span>
    }
    <h1 class="hero__title reveal is-visible">{{ title }}</h1>
    @if (subtitle) {
      <p class="hero__subtitle reveal is-visible">{{ subtitle }}</p>
    }

    @if (showButtons) {
      <div class="hero__actions reveal is-visible">
        <a routerLink="/projects" class="btn-luxury btn-luxury--primary">
          <i class="fa-solid fa-arrow-right"></i> View Projects
        </a>
        <a routerLink="/contact" class="btn-luxury btn-luxury--outline">
          <i class="fa-solid fa-phone"></i> Contact Us
        </a>
      </div>
    }
  </div>
</section>
